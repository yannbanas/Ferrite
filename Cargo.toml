[workspace]
resolver = "2"
members = [
    "crates/ferrite-common",
    "crates/ferrite-metrics",
    "crates/ferrite-storage",
    "crates/ferrite-catalog",
    "crates/ferrite-sql",
    "crates/ferrite-planner",
    "crates/ferrite-exec",
    "crates/ferrite-proc",
    "crates/ferrite-protocol",
    "crates/ferrite-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["ybanas"]
repository = "https://github.com/mairie-creusot/Ferrite"

[workspace.dependencies]
ferrite-common = { path = "crates/ferrite-common" }
# Registry only by default; `ferrite-server` opts into the HTTP endpoint
# so that the crates below it need no async runtime to record a counter.
ferrite-metrics = { path = "crates/ferrite-metrics", default-features = false }
ferrite-storage = { path = "crates/ferrite-storage" }
ferrite-catalog = { path = "crates/ferrite-catalog" }
ferrite-sql = { path = "crates/ferrite-sql" }
ferrite-planner = { path = "crates/ferrite-planner" }
ferrite-exec = { path = "crates/ferrite-exec" }
ferrite-proc = { path = "crates/ferrite-proc" }
ferrite-protocol = { path = "crates/ferrite-protocol" }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"

[profile.bench]
opt-level = 3
lto = "thin"
debug = true
