[package]
name = "ferrite-metrics"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Prometheus metrics registry and the HTTP endpoint that exposes them, plus the application-level health probe used by container orchestrators."

[features]
default = ["endpoint"]
# The HTTP listener. Off, this crate is the registry alone and needs no
# async runtime, which is what lets `ferrite-storage` record a checksum
# failure without gaining a dependency on tokio.
endpoint = ["dep:tokio", "dep:async-trait"]

[dependencies]
async-trait = { version = "0.1", optional = true }
tokio = { workspace = true, optional = true }
tracing.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
