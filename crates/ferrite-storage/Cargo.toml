[package]
name = "ferrite-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Page-based storage engine: B-tree, MVCC row versions, crash-recovery journal. Implements ferrite_common::StorageEngine."

[dependencies]
ferrite-common.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Only for `flock` on the data directory. Windows has an exclusive share
# mode in `std`; Unix has no equivalent, and a lock the kernel releases on
# process death is the only kind that survives a crash without blocking the
# restart that follows it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest.workspace = true
