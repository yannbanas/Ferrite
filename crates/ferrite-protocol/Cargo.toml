[package]
name = "ferrite-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "PostgreSQL wire protocol v3 server: framing, auth, TLS. Speaks the protocol so existing psql/JDBC/ODBC/sqlx/Diesel clients work unmodified. Owned by Agent 4, alongside ferrite-server."

[dependencies]
ferrite-common.workspace = true
ferrite-metrics.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
rustls-pki-types = "1"
async-trait = "0.1"
subtle = "2.6"
sha2 = "0.10"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rcgen = "0.13"
tracing-subscriber.workspace = true
