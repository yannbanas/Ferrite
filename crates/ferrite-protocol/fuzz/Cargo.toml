[package]
name = "ferrite-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Its own workspace: cargo-fuzz needs nightly and libfuzzer, neither of
# which should be dragged into the main workspace's stable build.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferrite-protocol = { path = ".." }
tokio = { version = "1", features = ["rt", "io-util", "macros"] }

[[bin]]
name = "message_decode"
path = "fuzz_targets/message_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session"
path = "fuzz_targets/session.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true
