[package]
name = "ferrite-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Binary: wires storage + catalog + planner/exec/proc + protocol together and listens on 5432. Owned by Agent 4, alongside ferrite-protocol."

[[bin]]
name = "ferrite-server"
path = "src/main.rs"

# The engine crates (ferrite-storage, ferrite-catalog, ferrite-sql,
# ferrite-planner, ferrite-exec, ferrite-proc) are deliberately absent for
# now: they are still scaffolds, and depending on them would only couple
# this binary's build to work in progress. They come back in as soon as
# `ferrite-exec` exposes something that implements `QueryHandler` — see the
# crate README, §Wiring status.
[dependencies]
ferrite-protocol.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rcgen = "0.13"
rand = "0.8"

[dev-dependencies]
tokio-postgres = "0.7"
