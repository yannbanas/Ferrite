name: Fuzz

# Fuzzing needs a nightly toolchain and takes minutes, not seconds, so it
# runs nightly and on demand rather than on every push — the parser's
# panic-freedom is also covered by proptest in the normal CI test job.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to run each fuzz target"
        required: false
        default: "300"

permissions:
  contents: read

jobs:
  sql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_sql, lex_sql]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, toolchain: nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-fuzz
      - name: Seed the corpus
        working-directory: crates/ferrite-sql/fuzz
        run: |
          mkdir -p "corpus/${{ matrix.target }}"
          cp seeds/* "corpus/${{ matrix.target }}/"
      - name: Fuzz
        working-directory: crates/ferrite-sql
        run: |
          cargo fuzz run "${{ matrix.target }}" -- \
            -max_total_time="${{ github.event.inputs.seconds || '300' }}" \
            -max_len=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/ferrite-sql/fuzz/artifacts
