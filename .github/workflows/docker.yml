name: Docker

# Publie ghcr.io/mairie-creusot/ferrite (ferrite-server, voir Dockerfile).
# Meme patron que docker.yml de chronotopedb et docker-pawchat.yml du fork
# SpacetimeDB de PawChat : push sur main touchant le code, ou declenchement
# manuel.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag supplementaire a publier en plus de latest/sha-*"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        run: |
          tags="ghcr.io/mairie-creusot/ferrite:latest
          ghcr.io/mairie-creusot/ferrite:sha-${GITHUB_SHA::12}"
          if [ -n "${{ inputs.tag }}" ]; then
            tags="$tags
          ghcr.io/mairie-creusot/ferrite:${{ inputs.tag }}"
          fi
          {
            echo "list<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Le package reste prive par defaut : Ferrite est encore au stade
      # scaffold, aucune raison de le publier publiquement pour l'instant
      # (contrairement a chronotopedb). A rappeler explicitement plutot que
      # de compter sur le defaut GitHub, deja source d'un piege documente
      # dans mairie-creusot/SpacetimeDB PAWCHAT.md.
      - name: Rappel visibilite du package
        run: |
          echo "::notice::Package prive par defaut. Ne pas le rendre public sans decision explicite."

  size-check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Necessaire pour un package prive (meme lecon que pawchat-kv/docker.yml :
      # un docker pull anonyme sur un package prive echoue en "unauthorized").
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull et verifie la taille de l'image
        run: |
          docker pull ghcr.io/mairie-creusot/ferrite:sha-${GITHUB_SHA::12}
          size_bytes=$(docker inspect ghcr.io/mairie-creusot/ferrite:sha-${GITHUB_SHA::12} --format='{{.Size}}')
          size_mb=$((size_bytes / 1024 / 1024))
          echo "Taille de l'image : ${size_mb} Mo"
          if [ "$size_mb" -gt 40 ]; then
            echo "::error::Image de ${size_mb} Mo — depasse le budget de 40 Mo fixe pour ce projet."
            exit 1
          fi
